<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bounce Run</title>
<style>
  :root { --bg:#12172b; --panel:#1c2340; --ink:#f3f5ff; --gold:#ffc83d; --coral:#ff5d73; --mint:#3ddc97; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; overflow: hidden; touch-action: none; }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { background: linear-gradient(#1b2347, #0e1226); border: 3px solid var(--panel);
    border-radius: 12px; max-width: 100%; max-height: 100%; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(10,13,28,.85); text-align: center; padding: 20px; }
  #overlay.hidden { display: none; }
  h1 { font-size: clamp(32px, 7vw, 56px); color: var(--gold); letter-spacing: 1px; }
  p { max-width: 420px; line-height: 1.5; opacity: .9; }
  button { font: inherit; font-weight: bold; font-size: 20px; padding: 12px 34px; border: 0; border-radius: 30px;
    background: var(--gold); color: #1b1b2f; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="500"></canvas>
  <div id="overlay">
    <h1 id="title">Bounce Run</h1>
    <p id="msg">Move the paddle to keep the ball alive. Break every brick to clear the stage. Don't let the ball fall!<br><br>
      Controls: mouse / touch drag, or ← → keys. Press Space to launch.</p>
    <button id="btn">Start Game</button>
  </div>
</div>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const msgEl = document.getElementById('msg');
const btn = document.getElementById('btn');

/* ================= SETTINGS ================= */
const MAX_LIVES = 3;
const BALL_RADIUS = 9;
const PADDLE_H = 14;

/* Each stage: ball speed, paddle width, brick rows, and brick colors */
const STAGES = [
  { speed: 5.0, paddle: 130, rows: 3, colors: ['#3ddc97', '#59e0a8', '#7ee8bb'], ball: '#ffc83d' },
  { speed: 6.0, paddle: 115, rows: 4, colors: ['#4da3ff', '#6fb5ff', '#8fc6ff', '#b0d8ff'], ball: '#ff9f43' },
  { speed: 7.0, paddle: 100, rows: 5, colors: ['#ff5d73', '#ff7a8b', '#ff97a3', '#ffb3bb', '#ffd0d5'], ball: '#3ddc97' },
  { speed: 8.0, paddle: 85,  rows: 6, colors: ['#b66dff', '#c487ff', '#d3a1ff', '#e1bbff', '#eed5ff', '#f8eeff'], ball: '#ffffff' }
];

/* ================= STATE ================= */
let stageIndex, score, lives, bricks, particles, state; // state: 'ready' | 'playing' | 'over' | 'won' | 'menu'
let paddle = { x: 0, w: 130 };
let ball = { x: 0, y: 0, dx: 0, dy: 0, speed: 5 };
let keys = { left: false, right: false };
let best = 0;
try { best = Number(localStorage.getItem('bounceRunBest') || 0); } catch (err) { best = 0; }

/* ================= STAGE BUILDING ================= */
function buildBricks() {
  const s = STAGES[stageIndex];
  const cols = 10, gap = 6, top = 60, bh = 22;
  const bw = (W - 40 - gap * (cols - 1)) / cols;
  bricks = [];
  for (let r = 0; r < s.rows; r++) {
    for (let c = 0; c < cols; c++) {
      bricks.push({
        x: 20 + c * (bw + gap), y: top + r * (bh + gap), w: bw, h: bh,
        color: s.colors[r % s.colors.length],
        hits: stageIndex >= 2 && r === 0 ? 2 : 1,   // tough bricks on later stages
        alive: true
      });
    }
  }
}

function loadStage() {
  const s = STAGES[stageIndex];
  paddle.w = s.paddle;
  paddle.x = (W - paddle.w) / 2;
  ball.speed = s.speed;
  buildBricks();
  resetBall();
}

function resetBall() {
  ball.x = paddle.x + paddle.w / 2;
  ball.y = H - 40 - BALL_RADIUS;
  ball.dx = 0; ball.dy = 0;
  state = 'ready';
}

function launchBall() {
  if (state !== 'ready') return;
  const angle = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
  ball.dx = Math.cos(angle) * ball.speed;
  ball.dy = Math.sin(angle) * ball.speed;
  state = 'playing';
}

function newGame() {
  stageIndex = 0; score = 0; lives = MAX_LIVES; particles = [];
  loadStage();
  overlay.classList.add('hidden');
}

/* ================= INPUT ================= */
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.code === 'Space') { e.preventDefault(); launchBall(); }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});
function pointerMove(clientX) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
}
canvas.addEventListener('mousemove', e => pointerMove(e.clientX));
canvas.addEventListener('touchmove', e => { pointerMove(e.touches[0].clientX); }, { passive: true });
canvas.addEventListener('touchstart', e => { pointerMove(e.touches[0].clientX); launchBall(); }, { passive: true });
canvas.addEventListener('click', launchBall);
btn.addEventListener('click', newGame);

/* ================= EFFECTS ================= */
function burst(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({ x, y, dx: (Math.random() - .5) * 5, dy: (Math.random() - .5) * 5, life: 28, color });
  }
}

/* ================= SOUND (tiny beeps, no files needed) ================= */
let audioCtx;
function beep(freq, dur = 0.07) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = 'square'; g.gain.value = 0.04;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (err) { /* sound not available */ }
}

/* ================= UPDATE ================= */
function update() {
  // paddle keyboard movement
  if (keys.left)  paddle.x = Math.max(0, paddle.x - 9);
  if (keys.right) paddle.x = Math.min(W - paddle.w, paddle.x + 9);

  // particles
  particles.forEach(p => { p.x += p.dx; p.y += p.dy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  if (state === 'ready') { ball.x = paddle.x + paddle.w / 2; return; }
  if (state !== 'playing') return;

  ball.x += ball.dx;
  ball.y += ball.dy;

  // walls and ceiling
  if (ball.x < BALL_RADIUS) { ball.x = BALL_RADIUS; ball.dx *= -1; beep(300); }
  if (ball.x > W - BALL_RADIUS) { ball.x = W - BALL_RADIUS; ball.dx *= -1; beep(300); }
  if (ball.y < BALL_RADIUS) { ball.y = BALL_RADIUS; ball.dy *= -1; beep(300); }

  // paddle bounce: angle depends on where the ball hits
  const py = H - 30 - PADDLE_H;
  if (ball.dy > 0 && ball.y + BALL_RADIUS >= py && ball.y + BALL_RADIUS <= py + PADDLE_H + 8 &&
      ball.x >= paddle.x - 4 && ball.x <= paddle.x + paddle.w + 4) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 to 1
    const angle = hit * (Math.PI / 3);                                  // up to 60 degrees
    ball.dx = Math.sin(angle) * ball.speed;
    ball.dy = -Math.cos(angle) * ball.speed;
    ball.y = py - BALL_RADIUS;
    beep(520);
  }

  // brick collisions
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + BALL_RADIUS > b.x && ball.x - BALL_RADIUS < b.x + b.w &&
        ball.y + BALL_RADIUS > b.y && ball.y - BALL_RADIUS < b.y + b.h) {
      // decide which side was hit
      const overlapX = Math.min(ball.x + BALL_RADIUS - b.x, b.x + b.w - (ball.x - BALL_RADIUS));
      const overlapY = Math.min(ball.y + BALL_RADIUS - b.y, b.y + b.h - (ball.y - BALL_RADIUS));
      if (overlapX < overlapY) ball.dx *= -1; else ball.dy *= -1;
      b.hits--;
      if (b.hits <= 0) { b.alive = false; score += 10 * (stageIndex + 1); burst(b.x + b.w / 2, b.y + b.h / 2, b.color); beep(700); }
      else { beep(450); }
      break;
    }
  }

  // stage cleared
  if (bricks.every(b => !b.alive)) {
    if (stageIndex === STAGES.length - 1) endGame(true);
    else { stageIndex++; score += 50; loadStage(); beep(900, .2); }
    return;
  }

  // ball fell: lose a life
  if (ball.y - BALL_RADIUS > H) {
    lives--;
    beep(150, .25);
    if (lives <= 0) endGame(false); else resetBall();
  }
}

function endGame(won) {
  state = won ? 'won' : 'over';
  if (score > best) { best = score; try { localStorage.setItem('bounceRunBest', best); } catch (err) { /* storage unavailable */ } }
  titleEl.textContent = won ? 'You Win!' : 'Game Over';
  titleEl.style.color = won ? 'var(--mint)' : 'var(--coral)';
  msgEl.innerHTML = (won ? 'You cleared all ' + STAGES.length + ' stages.' : 'The ball got past you on stage ' + (stageIndex + 1) + '.') +
    '<br>Score: <b>' + score + '</b> &nbsp; Best: <b>' + best + '</b>';
  btn.textContent = 'Play Again';
  overlay.classList.remove('hidden');
}

/* ================= DRAW ================= */
function drawRoundRect(x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#f3f5ff';
  ctx.font = 'bold 18px "Trebuchet MS", sans-serif';
  ctx.textAlign = 'left';  ctx.fillText('Score ' + score, 20, 32);
  ctx.textAlign = 'center'; ctx.fillText('Stage ' + (stageIndex + 1) + ' / ' + STAGES.length, W / 2, 32);
  ctx.textAlign = 'right';
  for (let i = 0; i < MAX_LIVES; i++) {
    ctx.fillStyle = i < lives ? '#ff5d73' : '#3a4166';
    ctx.beginPath(); ctx.arc(W - 28 - i * 26, 27, 8, 0, Math.PI * 2); ctx.fill();
  }

  // bricks (tough bricks get a bright outline)
  bricks.forEach(b => {
    if (!b.alive) return;
    drawRoundRect(b.x, b.y, b.w, b.h, 5, b.color);
    if (b.hits > 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4); }
  });

  // paddle
  drawRoundRect(paddle.x, H - 30 - PADDLE_H, paddle.w, PADDLE_H, 7, '#f3f5ff');

  // ball with glow
  const s = STAGES[stageIndex];
  ctx.shadowColor = s.ball; ctx.shadowBlur = 16;
  ctx.fillStyle = s.ball;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 28; ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  });
  ctx.globalAlpha = 1;

  // launch hint
  if (state === 'ready') {
    ctx.fillStyle = 'rgba(243,245,255,.8)'; ctx.textAlign = 'center'; ctx.font = '16px "Trebuchet MS", sans-serif';
    ctx.fillText('Tap, click or press Space to launch', W / 2, H - 80);
  }
}

/* ================= MAIN LOOP ================= */
// initial values so the menu background can draw
stageIndex = 0; score = 0; lives = MAX_LIVES; particles = [];
loadStage(); state = 'menu';

function loop() {
  if (state !== 'menu') update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
